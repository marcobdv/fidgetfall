<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Clockwork Menagerie — a single re-seatable gear. Tier-1 final, flat vector. -->
  <!-- teeth: 8 squared teeth around the rim -->
  <g fill="#c98a3a" stroke="#5a3a16" stroke-width="1">
    <rect x="17" y="1"  width="6" height="8" rx="1"/>
    <rect x="17" y="31" width="6" height="8" rx="1"/>
    <rect x="1"  y="17" width="8" height="6" rx="1"/>
    <rect x="31" y="17" width="8" height="6" rx="1"/>
    <rect x="5.5"  y="5.5"  width="6" height="8" rx="1" transform="rotate(45 8.5 9.5)"/>
    <rect x="28.5" y="5.5"  width="6" height="8" rx="1" transform="rotate(-45 31.5 9.5)"/>
    <rect x="5.5"  y="26.5" width="6" height="8" rx="1" transform="rotate(-45 8.5 30.5)"/>
    <rect x="28.5" y="26.5" width="6" height="8" rx="1" transform="rotate(45 31.5 30.5)"/>
  </g>
  <!-- gear body -->
  <circle cx="20" cy="20" r="13" fill="#c98a3a" stroke="#5a3a16" stroke-width="1.5"/>
  <!-- inner hub -->
  <circle cx="20" cy="20" r="7" fill="#e9c27a" stroke="#5a3a16" stroke-width="1"/>
  <!-- center bore -->
  <circle cx="20" cy="20" r="3" fill="#3d3450"/>
</svg>
