<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Clockwork Menagerie — cozy lamplit workbench background. Tier-1 final, flat vector. -->
  <!-- dark quiet surround -->
  <rect x="0" y="0" width="640" height="360" fill="#2a2438"/>
  <!-- warm pool of lamplight (soft radial) -->
  <defs>
    <radialGradient id="lamp" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#f4ead8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#e9c27a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2a2438" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="320" cy="160" rx="300" ry="180" fill="url(#lamp)"/>
  <!-- back wall hint above the bench -->
  <rect x="0" y="0" width="640" height="240" fill="#3d3450" opacity="0.35"/>
  <!-- bench surface (warm wood) -->
  <rect x="0" y="240" width="640" height="120" fill="#7c5a8c" opacity="0.0"/>
  <rect x="0" y="240" width="640" height="120" fill="#5a3a16" opacity="0.55"/>
  <rect x="0" y="240" width="640" height="14" fill="#c98a3a" opacity="0.45"/>
  <!-- a couple of plank seams for texture, kept minimal -->
  <line x1="210" y1="254" x2="210" y2="360" stroke="#2a2438" stroke-width="2" opacity="0.3"/>
  <line x1="455" y1="254" x2="455" y2="360" stroke="#2a2438" stroke-width="2" opacity="0.3"/>
  <!-- hanging lamp (top, off-center) -->
  <line x1="150" y1="0" x2="150" y2="40" stroke="#3d3450" stroke-width="3"/>
  <path d="M126 40 h48 l-10 26 h-28 z" fill="#c98a3a" stroke="#5a3a16" stroke-width="2"/>
  <ellipse cx="150" cy="66" rx="13" ry="5" fill="#f4ead8"/>
  <circle cx="150" cy="58" r="6" fill="#e9c27a"/>
  <!-- a small jar of spare parts on the bench (right, uncluttered prop) -->
  <rect x="540" y="206" width="40" height="48" rx="6" fill="#7c5a8c" opacity="0.7" stroke="#5a3a16" stroke-width="1.5"/>
  <rect x="540" y="200" width="40" height="8" rx="3" fill="#c98a3a"/>
  <circle cx="552" cy="234" r="4" fill="#c98a3a" opacity="0.8"/>
  <circle cx="566" cy="240" r="3" fill="#e9c27a" opacity="0.8"/>
  <circle cx="560" cy="226" r="3" fill="#c98a3a" opacity="0.7"/>
</svg>
