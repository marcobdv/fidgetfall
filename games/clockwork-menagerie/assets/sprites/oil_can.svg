<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Clockwork Menagerie — oil can / dropper. Tier-1 final, flat vector. -->
  <!-- can body -->
  <path d="M10 28 q0 -8 8 -8 h10 q8 0 8 8 v8 q0 4 -4 4 h-18 q-4 0 -4 -4 z"
        fill="#7c5a8c" stroke="#5a3a16" stroke-width="1.5"/>
  <!-- belly highlight -->
  <ellipse cx="22" cy="33" rx="8" ry="4" fill="#e9c27a" opacity="0.4"/>
  <!-- spout -->
  <path d="M33 22 L44 9 L46 11 L36 25 Z" fill="#c98a3a" stroke="#5a3a16" stroke-width="1.5"/>
  <!-- top neck -->
  <rect x="19" y="14" width="8" height="7" rx="1.5" fill="#c98a3a" stroke="#5a3a16" stroke-width="1.5"/>
  <!-- press handle -->
  <rect x="17" y="11" width="12" height="3.5" rx="1.5" fill="#8a6a3a"/>
  <!-- oil drop falling from spout -->
  <path d="M45 16 q3 4 0 6 q-3 -2 0 -6 z" fill="#e8836b"/>
</svg>
