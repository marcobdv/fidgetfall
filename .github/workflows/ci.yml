# Two independent checks, because the repo now holds two toolchains (ADR-0009):
#
#  * sample-clockwork — the Godot/C# harness smoke test, using the same sequence
#    BOOTSTRAP.md §4 asks a human to run. If it is green, the studio's pipeline works.
#  * holdem — the TypeScript Texas Hold'em experiment under apps/, which shares no
#    toolchain with the Godot side and so runs as a wholly independent job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sample-clockwork:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/sample-clockwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Setup Godot 4.7 (.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: true
          include-templates: false   # no exports here; flip on when adding an export job
      # Only [RequireGodotRuntime] tests need GODOT_BIN, but setting it is cheap:
      - run: echo "GODOT_BIN=$(which godot)" >> "$GITHUB_ENV"
      - name: Build C#
        run: dotnet build
      - name: Import assets (fresh checkout has no .godot/ cache)
        run: godot --headless --import --path .
      - name: Smoke-run Main.tscn for 90 frames
        run: godot --headless --path . --quit-after 90
      - name: Test (GdUnit4, headless)
        run: dotnet test test/

  holdem:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/holdem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/holdem/package-lock.json
      - run: npm ci
      - name: Typecheck (source and tests)
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tsconfig.test.json
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
